services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: jagrat
      POSTGRES_PASSWORD: jagrat
      POSTGRES_DB: jagrat
    ports:
      - "5432:5432"
    volumes:
      - jagrat_pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://jagrat:jagrat@db:5432/jagrat
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FAST_MODEL: ${GEMINI_FAST_MODEL:-gemini-3.1-flash-lite}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DEMO_MODE: ${DEMO_MODE:-false}
      ALLOW_LEGACY_PROFILE_ID: ${ALLOW_LEGACY_PROFILE_ID:-false}
      SEED_DEMO_ON_STARTUP: ${SEED_DEMO_ON_STARTUP:-false}
      AUTO_INGEST_TEACHINGS: ${AUTO_INGEST_TEACHINGS:-true}
      TEACHINGS_JSON_PATH: ${TEACHINGS_JSON_PATH:-data/articles.json}
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  jagrat_pgdata:
