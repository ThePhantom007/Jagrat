services:
  - type: web
    name: jagrat-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FAST_MODEL
        value: gemini-3.1-flash-lite
      - key: CORS_ORIGINS
        sync: false
      - key: TEACHINGS_JSON_PATH
        value: data/articles.json
      - key: DEMO_MODE
        value: "false"
      - key: ALLOW_LEGACY_PROFILE_ID
        value: "false"
      - key: SEED_DEMO_ON_STARTUP
        value: "false"
      - key: AUTO_INGEST_TEACHINGS
        value: "true"
